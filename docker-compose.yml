# Local development database only — production uses Supabase
services:
  postgres:
    image: postgres:16-alpine
    container_name: cjh-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusjobshub
    volumes:
      - cjh_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-citext.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campusjobshub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cjh_pg_data:
